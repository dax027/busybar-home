[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "busybar-home"
version = "0.1.0"
description = "Local visual control for BUSY Bar scenes, device health, and diagnostics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "busylib>=1.0,<2.0",
    "fastapi>=0.116,<1.0",
    "uvicorn>=0.35,<1.0",
]

[project.scripts]
busybar-home = "busybar_home.cli:main"
busybar-home-web = "busybar_home.web:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/busybar_home"]
